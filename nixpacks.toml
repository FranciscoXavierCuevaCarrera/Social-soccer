[variables]
NIXPACKS_NODE_VERSION = "24"
NODE_VERSION = "24.14.1"

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = [
  "cd template/app && npm install"
]

[phases.build]
cmds = [
  "cd template/app && npx --yes @wasp.sh/wasp-cli-linux-x64-glibc@0.25.0 build"
]

[start]
cmd = "cd template/app && npm start"
