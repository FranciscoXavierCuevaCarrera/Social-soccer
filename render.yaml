services:
  - type: web
    name: social-soccer-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: template/app

    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.25.0 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      wasp install &&
      wasp build &&
      cd .wasp/out/server &&
      npm install &&
      npx prisma generate --schema=../db/schema.prisma &&
      npm run bundle

    startCommand: cd .wasp/out/server && npm run start-production

    healthCheckPath: /

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: social-soccer-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: WASP_SERVER_URL
        sync: false

      - key: WASP_WEB_CLIENT_URL
        sync: false

      - key: NODE_VERSION
        value: "24"

      - key: ADMIN_EMAILS
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: AWS_S3_REGION
        value: "us-east-1"

      - key: AWS_S3_IAM_ACCESS_KEY
        sync: false

      - key: AWS_S3_IAM_SECRET_KEY
        sync: false

      - key: AWS_S3_FILES_BUCKET
        sync: false

      - key: PLAUSIBLE_API_KEY
        sync: false

      - key: PLAUSIBLE_SITE_ID
        sync: false

      - key: PLAUSIBLE_BASE_URL
        value: "https://plausible.io"

      - key: GOOGLE_ANALYTICS_CLIENT_EMAIL
        sync: false

      - key: GOOGLE_ANALYTICS_PRIVATE_KEY
        sync: false

      - key: GOOGLE_ANALYTICS_PROPERTY_ID
        sync: false

  - type: web
    name: social-soccer-client
    runtime: static
    branch: main
    rootDir: template/app

    buildCommand: >-
      npm install -g @wasp.sh/wasp-cli@0.25.0 &&
      export PATH="$(npm prefix -g)/bin:$PATH" &&
      wasp install &&
      wasp build &&
      npx vite build

    staticPublishPath: .wasp/out/web-app/build

    envVars:
      - key: REACT_APP_API_URL
        sync: false

      - key: NODE_VERSION
        value: "24"

    routes:
      - type: rewrite
        source: /*
        destination: /200.html

databases:
  - name: social-soccer-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"